<div class="app" id="app" data-view="list" data-sheet="half">
  <header class="top">
    <h1><button type="button" id="navhome" class="brand" aria-label="Alpengipfel, zur Startseite"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#1f2a27"/><path d="M4.5 25 12.2 11.3l3.6 5.8 3.4-5.3L27.5 25z" fill="#f3f6f3"/><path d="m10.4 14.5 1.8-3.2 1.9 3-1.2-.6zM17.7 14.1l1.5-2.3 1.6 2.4-1.1-.5z" fill="#8fb8d6"/><circle cx="12.2" cy="8.6" r="2.3" fill="#c62828" stroke="#f3f6f3" stroke-width="1"/></svg><span>Alpengipfel</span></button></h1>
    <span class="sub" id="sub">Alle benannten Gipfel der Alpen aus OpenStreetMap</span>
    <nav class="nav" aria-label="Bereiche"><button id="navstart" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/></svg><span>Start</span></button><button id="navexp" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 19.5 9 8l3.5 6 2.5-4 6.5 9.5z"/></svg><span>Gipfel</span></button><button id="openbook" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h11a2 2 0 0 1 2 2v13H7a2 2 0 0 1-2-2z"/><path d="M5 17.5a2 2 0 0 1 2-2h11"/><path d="m9 9.5 2 2 3.5-3.5"/></svg><span>Gipfelbuch</span></button><button id="openprofile" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/></svg><span>Profil</span></button></nav>
    <button type="button" id="openfb" class="fbbtn" aria-label="Feedback geben"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9.5h8M8 12.5h5"/></svg><span>Feedback</span></button>
    <div class="tabs" role="group" aria-label="Ansicht">
      <button id="tab-list" type="button" aria-pressed="true">Liste</button>
      <button id="tab-map" type="button" aria-pressed="false">Karte</button>
    </div>
  </header>

  <main class="page" id="page" hidden></main>

  <section class="side" id="side">
    <div class="grab" id="grab" aria-hidden="true"><span></span></div>
    <div class="filters" id="filters">
      <div class="f wide fq"><label for="q">Name</label><div class="qrow"><input id="q" type="search" placeholder="Gipfel suchen, z. B. Großglockner" autocomplete="off"><button type="button" class="ftoggle" id="ftoggle" aria-expanded="false" aria-controls="filters">Filter<b id="fcount" hidden></b></button></div></div>
      <div class="f wide">
        <span class="lab">Höhe in Metern</span>
        <div class="hrow"><input id="hmin" type="number" inputmode="numeric" min="0" max="4900" step="50" placeholder="von" aria-label="Mindesthöhe"><span>bis</span><input id="hmax" type="number" inputmode="numeric" min="0" max="4900" step="50" placeholder="bis" aria-label="Maximalhöhe"></div>
        <div class="bands" id="bands"></div>
      </div>
      <div class="f"><label for="country">Land</label><select id="country"></select></div>
      <div class="f"><label for="state">Bundesland / Region</label><select id="state"></select></div>
      <div class="f wide"><label for="group">Gebirgsgruppe</label><select id="group"></select></div>
      <div class="f wide"><label for="kind">Weg zum Gipfel</label><select id="kind"><option value="">Alle Gipfel</option><option value="0">Wandern (bis T3)</option><option value="1">Hochalpin (T4–T6)</option><option value="2">Klettersteig</option><option value="3">Skitour</option><option value="4">Nur Weg in Gipfelnähe</option><option value="none">Kein Weg, keine Route erfasst</option></select></div>
      <div class="f"><label for="book">Gipfelbuch</label><select id="book"><option value="">Alle Gipfel</option><option value="done">Bestiegen</option><option value="todo">Noch nicht bestiegen</option><option value="wish">Wunschliste</option></select></div>
      <div class="f"><span class="lab">In meiner Nähe</span><div class="hrow"><button class="nearbtn" id="near" type="button">Standort verwenden</button><select id="radius" aria-label="Umkreis" hidden><option value="">beliebig weit</option><option value="10">10 km</option><option value="25">25 km</option><option value="50">50 km</option><option value="100">100 km</option></select></div></div>
      <div class="f wide note" id="nearmsg" hidden></div>
    </div>
    <div class="status">
      <span><strong id="count">–</strong> Gipfel</span>
      <button class="reset" id="reset" type="button" hidden>Filter zurücksetzen</button>
      <select id="sort" aria-label="Sortierung">
        <option value="hd">Höchste zuerst</option>
        <option value="ha">Niedrigste zuerst</option>
        <option value="na">Name A–Z</option>
        <option value="near">Nächste zuerst</option>
      </select>
    </div>
    <div class="list" id="list" tabindex="0"><div class="spacer" id="spacer"></div></div>
    <footer class="foot" id="foot" hidden></footer>
    <div class="detail" id="detail" hidden></div>
    <div class="detail" id="bookpanel" hidden></div>
    <div class="loading" id="loading">Gipfeldaten werden geladen …</div>
  </section>

  <section class="mapwrap" id="mapwrap">
    <div id="map"></div>
    <div class="legend" id="legendbox" data-open="true"><button type="button" class="legtoggle" id="legtoggle" aria-expanded="true" aria-controls="legbody">Legende</button><div class="lrow note" id="tmsg" role="status" hidden></div><div class="legbody" id="legbody"><div class="lrow" id="legend"></div><div class="lrow" id="tlegend" hidden></div><label class="lrow hutrow"><input type="checkbox" id="huts" checked><i class="sq"></i>Hütten anzeigen (ab mittlerer Zoomstufe)</label></div></div>
    <div class="tip" id="tip" hidden></div>
    <div class="view3d" id="view3d" hidden><div id="v3map"></div><button class="back" id="v3close" type="button">← Zur flachen Karte</button><div class="v3hint">Ziehen: verschieben · rechte Maustaste oder zwei Finger: drehen und kippen</div><div class="v3msg" id="v3msg" role="status"></div></div>
  </section>
</div>
